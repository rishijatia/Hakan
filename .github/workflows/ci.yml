name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck jq

      - name: Layer 1 — static checks (lint)
        run: bash tests/lint/run_all.sh

      - name: Layer 2 — skill unit tests
        run: bash tests/skills/run_all_skills.sh

      # Note: Layer 3 (smoke tests against live Fly apps) intentionally
      # NOT in CI — those run post-deploy locally where flyctl is auth'd.
