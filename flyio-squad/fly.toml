app = 'hermes-coding-squad'
primary_region = 'fra'

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "gateway run"

# API server config — Hermes exposes OpenAI-compatible chat completions
# Reachable from other Fly apps in this org at hermes-coding-squad.internal:8642
# Not exposed publicly (no [[services]] block).
[env]
  API_SERVER_ENABLED = "true"
  API_SERVER_HOST = "fly-local-6pn"
  API_SERVER_PORT = "8642"

[[mounts]]
  source = "squad_data"
  destination = "/opt/data"

[[vm]]
  memory = "1gb"
  cpus = 1
